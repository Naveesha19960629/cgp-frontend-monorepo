sonar.projectKey=cgp-frontend-monorepo
sonar.projectName=cgp frontend monorepo
sonar.sourceEncoding=UTF-8

sonar.sources=apps/ats-module/src,apps/cooperate-portal-shell/src,packages/data-access/src,packages/ui-kit/src
sonar.tests=apps/ats-module/tests,apps/cooperate-portal-shell/tests

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Coverage
sonar.javascript.lcov.reportPaths=apps/ats-module/coverage/lcov.info,apps/cooperate-portal-shell/coverage/lcov.info

# Exclusions
sonar.exclusions=\
node_modules/**,\
dist/**,\
coverage/**,\
public/**,\
src/components/ui/**,\
src/views/my-portal/hooks/mutations/**,\
src/views/my-portal/hooks/queries/**,\
src/views/job-application/hooks/mutations/**,\
src/views/job-application/hooks/queries/**,\
src/views/utils/i18n/**,\
src/libs/backend-axios.ts

# Typescript
sonar.typescript.tsconfigPath=apps/ats-module/tsconfig.json,apps/cooperate-portal-shell/tsconfig.json