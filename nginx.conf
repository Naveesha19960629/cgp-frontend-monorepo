server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # GLOBAL CORS (IMPORTANT: duplicated everywhere safely)
    # =========================
    set $cors_origin "*";

    # =========================
    # Remote Entry (MUST MATCH EXACT PATH)
    # =========================
    location = /assets/remoteEntry.js {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        default_type application/javascript;
    }

    # =========================
    # JS / MJS / ES Modules (CRITICAL FIX)
    # =========================
    location ~* \.(js|mjs)$ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        types {
            application/javascript js mjs;
        }

        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # =========================
    # Other static assets
    # =========================
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # =========================
    # SPA fallback
    # =========================
    location / {
        try_files $uri $uri/ /index.html;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }

    # =========================
    # Gzip
    # =========================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json;
}