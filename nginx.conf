server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # CORS Configuration
    # =========================
    # Allow all origins - necessary for cross-origin module federation
    set $cors_origin "*";
    set $cors_methods "GET, POST, PUT, DELETE, OPTIONS";
    set $cors_headers "Content-Type, Authorization, X-Requested-With, Accept";

    # =========================
    # PREFLIGHT requests (OPTIONS method)
    # =========================
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods $cors_methods always;
        add_header Access-Control-Allow-Headers $cors_headers always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        add_header Content-Type text/plain always;
        return 204;
    }

    # =========================
    # Remote Entry (MUST MATCH EXACT PATH) - Module Federation
    # =========================
    location = /assets/remoteEntry.js {
        # Ensure file exists, don't try_files to index.html
        try_files $uri =404;

        # CORS headers for remoteEntry.js
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods $cors_methods always;
        add_header Access-Control-Allow-Headers $cors_headers always;

        # Cache Control - no cache for remoteEntry to ensure latest version
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Proper content type
        default_type application/javascript;
        types {
            application/javascript js mjs;
        }
    }

    # =========================
    # JS / MJS / ES Modules
    # =========================
    location ~* \.(js|mjs)$ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods $cors_methods always;
        add_header Access-Control-Allow-Headers $cors_headers always;

        types {
            application/javascript js mjs;
        }

        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # =========================
    # Other static assets
    # =========================
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods $cors_methods always;
        add_header Access-Control-Allow-Headers $cors_headers always;

        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # =========================
    # SPA fallback (lowest priority)
    # =========================
    location / {
        try_files $uri $uri/ /index.html;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods $cors_methods always;
        add_header Access-Control-Allow-Headers $cors_headers always;
    }

    # =========================
    # Gzip
    # =========================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json;
}