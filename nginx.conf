server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # Remote Entry (MUST MATCH EXACT PATH) - Module Federation
    # =========================
    location = /assets/remoteEntry.js {
        # CORS headers for remoteEntry.js
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;

        # Cache Control - no cache for remoteEntry to ensure latest version
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain charset=UTF-8" always;
            return 204;
        }

        # Proper content type
        default_type application/javascript;
        types {
            application/javascript js mjs;
        }
    }

    # =========================
    # JS / MJS / ES Modules
    # =========================
    location ~* \.(js|mjs)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;

        types {
            application/javascript js mjs;
        }

        expires 30d;
        add_header Cache-Control "public, immutable" always;

        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0 always;
            return 204;
        }
    }

    # =========================
    # Other static assets
    # =========================
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;

        expires 30d;
        add_header Cache-Control "public, immutable" always;

        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0 always;
            return 204;
        }
    }

    # =========================
    # SPA fallback (lowest priority)
    # =========================
    location / {
        try_files $uri $uri/ /index.html;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization" always;

        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0 always;
            return 204;
        }
    }

    # =========================
    # Gzip
    # =========================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json;
}