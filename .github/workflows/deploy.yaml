name: Deploy CGP Frontend Microfrontends to Cloud Run

on:
  # pull_request:
  #   branches: [develop]
  #   types: [closed]
  push:
    branches: [feature/ci-cd-integration-multi-service]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  AR_HOSTNAME: us-central1-docker.pkg.dev
  REPOSITORY: cgp-repo

  SHELL_SERVICE: cgp-shell
  ATS_SERVICE: ats-module

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test
      
      - name: Build Application
        env:
          VITE_PORTAL_LOGO: ${{ secrets.VITE_PORTAL_LOGO }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FALLBACK_LANG: ${{ secrets.VITE_FALLBACK_LANG }}
          VITE_LANG: ${{ secrets.VITE_LANG }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_BACKEND_API_URL: ${{ secrets.VITE_BACKEND_API_URL }}
          VITE_BACKEND_API_VERSION: ${{ secrets.VITE_BACKEND_API_VERSION }}
        run: pnpm nx run-many -t build

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # 🔐 AUTH GCP
      # =========================
      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker $AR_HOSTNAME --quiet

      # =========================
      # 📦 VERSION
      # =========================
      - name: Get Version
        id: version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # =========================
      # 🔥 BUILD ATS IMAGE
      # =========================
      - name: Build ATS Image
        run: |
          docker build  --no-cache \
            -f Dockerfile.ats \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_FALLBACK_LANG=${{ secrets.VITE_FALLBACK_LANG }} \
            --build-arg VITE_LANG=${{ secrets.VITE_LANG }} \
            --build-arg VITE_OXO_LOGO_URL=${{ secrets.VITE_OXO_LOGO_URL }} \
            --build-arg VITE_OXO_LOGO_WHITE_URL=${{ secrets.VITE_OXO_LOGO_WHITE_URL }} \
            --build-arg VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }} \
            --build-arg VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }} \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }} \
            --build-arg VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }} \
            --build-arg VITE_BACKEND_API_VERSION=${{ secrets.VITE_BACKEND_API_VERSION }} \
            --build-arg VITE_WS_URL=${{ secrets.VITE_WS_URL }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:${{ steps.version.outputs.version }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:latest \
            .

      - name: Push ATS Image
        run: |
          docker push $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:${{ steps.version.outputs.version }}

      # =========================
      # 🚀 DEPLOY ATS FIRST
      # =========================
      - name: Deploy ATS Module
        id: deploy_ats
        run: |
          gcloud run deploy $ATS_SERVICE \
            --image=$AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:${{ steps.version.outputs.version }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --port=80 \
            --set-env-vars="NODE_ENV=production" \
            --revision-suffix=${{ github.sha }} \
            --labels="commit=${{ github.sha }},branch=develop,app=ats-module" \
            --quiet

          ATS_URL=$(gcloud run services describe $ATS_SERVICE \
            --region=$REGION \
            --format='value(status.url)')

          echo "ats_url=$ATS_URL" >> $GITHUB_OUTPUT
          echo "ATS URL: $ATS_URL"

      # =========================
      # 🧱 BUILD SHELL IMAGE (with ATS URL injection)
      # =========================
      - name: Build Shell Image
        run: |
          docker build --no-cache \
            -f Dockerfile.shell \
            --build-arg VITE_ATS_MODULE_URL=${{ steps.deploy_ats.outputs.ats_url }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VITE_PORTAL_LOGO=${{ secrets.VITE_PORTAL_LOGO }} \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_FALLBACK_LANG=${{ secrets.VITE_FALLBACK_LANG }} \
            --build-arg VITE_LANG=${{ secrets.VITE_LANG }} \
            --build-arg VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }} \
            --build-arg VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }} \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }} \
            --build-arg VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }} \
            --build-arg VITE_BACKEND_API_VERSION=${{ secrets.VITE_BACKEND_API_VERSION }} \
            --build-arg VITE_WS_URL=${{ secrets.VITE_WS_URL }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:${{ steps.version.outputs.version }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:latest \
            .

      - name: Push Shell Image
        run: |
          docker push $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:${{ steps.version.outputs.version }}

      # =========================
      # 🌐 DEPLOY SHELL
      # =========================
      - name: Deploy Shell
        id: deploy_shell
        run: |
          gcloud run deploy $SHELL_SERVICE \
            --image=$AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:${{ steps.version.outputs.version }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --port=80 \
            --set-env-vars="NODE_ENV=production" \
            --revision-suffix=${{ github.sha }} \
            --labels="commit=${{ github.sha }},branch=develop,app=cgp-shell" \
            --quiet

          SHELL_URL=$(gcloud run services describe $SHELL_SERVICE \
            --region=$REGION \
            --format='value(status.url)')

          echo "shell_url=$SHELL_URL" >> $GITHUB_OUTPUT

      # =========================
      # 📢 SUMMARY
      # =========================
      - name: Deployment Summary
        run: |
          echo "===================================="
          echo "ATS Module URL: ${{ steps.deploy_ats.outputs.ats_url }}"
          echo "Shell URL: ${{ steps.deploy_shell.outputs.shell_url }}"
          echo "===================================="