name: Deploy CGP Frontend Monorepo to QA Cloud Run

on:
  pull_request:
    branches: [qa]
    types: [closed]
    paths-ignore:
      - '.github/workflows/**'

env:
  PROJECT_ID: ${{ secrets.QA_GCP_PROJECT_ID }}
  REGION: us-central1
  AR_HOSTNAME: us-central1-docker.pkg.dev
  REPOSITORY: cgp-qa-repo
  ENVIRONMENT: qa
  SHELL_SERVICE: qa-cgp-shell
  ATS_SERVICE: qa-ats-module

jobs:
  build-and-test:
    if: github.event.pull_request.base.ref == 'qa' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.application-version.outputs.version }}
      should_deploy: ${{ steps.check-changes.outputs.should_deploy }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check for relevant changes
        id: check-changes
        run: |
          # Check if there are changes outside of documentation or config files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Filter out non-deployment related changes
          RELEVANT_CHANGES=$(echo "$CHANGED_FILES" | grep -v -E '\.md$|\.txt$|^docs/|^README|^LICENSE' || true)

          if [ -z "$RELEVANT_CHANGES" ]; then
            echo "No relevant changes detected for deployment"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "Relevant changes detected"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Build Application
        env:
          VITE_PORTAL_LOGO: ${{ secrets.QA_VITE_PORTAL_LOGO }}
          VITE_API_BASE_URL: ${{ secrets.QA_VITE_API_BASE_URL }}
          VITE_API_URL: ${{ secrets.QA_VITE_API_URL }}
          VITE_FALLBACK_LANG: ${{ secrets.QA_VITE_FALLBACK_LANG }}
          VITE_LANG: ${{ secrets.QA_VITE_LANG }}
          VITE_WS_URL: ${{ secrets.QA_VITE_WS_URL }}
          VITE_KEYCLOAK_URL: ${{ secrets.QA_VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.QA_VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.QA_VITE_KEYCLOAK_CLIENT_ID }}
          VITE_BACKEND_API_URL: ${{ secrets.QA_VITE_BACKEND_API_URL }}
          VITE_BACKEND_API_VERSION: ${{ secrets.QA_VITE_BACKEND_API_VERSION }}
        run: pnpm nx run-many -t build

  deploy-to-qa-cloud-run:
    if: github.event.pull_request.base.ref == 'qa' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.merged == true && needs.build-and-test.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # =========================
      # AUTH GCP
      # =========================
      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.QA_GCP_SA_KEY }}
          project_id: ${{ secrets.QA_GCP_PROJECT_ID }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.QA_GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $AR_HOSTNAME --quiet

      # =========================
      # VERSION
      # =========================
      - name: Get Application Version
        id: application-version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # =========================
      # BUILD ATS QA IMAGE
      # =========================
      - name: Build ATS Image
        run: |
          docker build  --no-cache \
            -f Dockerfile.ats \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VITE_API_BASE_URL=${{ secrets.QA_VITE_API_BASE_URL }} \
            --build-arg VITE_API_URL=${{ secrets.QA_VITE_API_URL }} \
            --build-arg VITE_FALLBACK_LANG=${{ secrets.QA_VITE_FALLBACK_LANG }} \
            --build-arg VITE_LANG=${{ secrets.QA_VITE_LANG }} \
            --build-arg VITE_OXO_LOGO_URL=${{ secrets.QA_VITE_OXO_LOGO_URL }} \
            --build-arg VITE_OXO_LOGO_WHITE_URL=${{ secrets.QA_VITE_OXO_LOGO_WHITE_URL }} \
            --build-arg VITE_KEYCLOAK_URL=${{ secrets.QA_VITE_KEYCLOAK_URL }} \
            --build-arg VITE_KEYCLOAK_REALM=${{ secrets.QA_VITE_KEYCLOAK_REALM }} \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=${{ secrets.QA_VITE_KEYCLOAK_CLIENT_ID }} \
            --build-arg VITE_BACKEND_API_URL=${{ secrets.QA_VITE_BACKEND_API_URL }} \
            --build-arg VITE_BACKEND_API_VERSION=${{ secrets.QA_VITE_BACKEND_API_VERSION }} \
            --build-arg VITE_WS_URL=${{ secrets.QA_VITE_WS_URL }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:${{ steps.version.outputs.version }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:latest \
            .

      - name: Push ATS Image
        run: |
          docker push $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:${{ steps.version.outputs.version }}


      # =========================
      # DEPLOY QA ATS FIRST
      # =========================
      - name: Deploy ATS Module
        id: deploy_ats
        run: |
          gcloud run deploy $ATS_SERVICE \
            --image=$AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$ATS_SERVICE:${{ steps.version.outputs.version }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --port=80 \
            --set-env-vars="NODE_ENV=production" \
            --revision-suffix=${{ github.sha }} \
            --labels="commit=${{ github.sha }},branch=qa,app=qa-ats-module" \
            --quiet

          ATS_URL=$(gcloud run services describe $ATS_SERVICE \
            --region=$REGION \
            --format='value(status.url)')

          echo "ats_url=$ATS_URL" >> $GITHUB_OUTPUT
          echo "ATS URL: $ATS_URL"

      # =========================
      # BUILD QA SHELL IMAGE (with QA ATS URL injection)
      # =========================
      - name: Build Shell Image
        run: |
          docker build --no-cache \
            -f Dockerfile.shell \
            --build-arg VITE_ATS_MODULE_URL=${{ steps.deploy_ats.outputs.ats_url }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VITE_PORTAL_LOGO=${{ secrets.QA_VITE_PORTAL_LOGO }} \
            --build-arg VITE_API_BASE_URL=${{ secrets.QA_VITE_API_BASE_URL }} \
            --build-arg VITE_API_URL=${{ secrets.QA_VITE_API_URL }} \
            --build-arg VITE_FALLBACK_LANG=${{ secrets.QA_VITE_FALLBACK_LANG }} \
            --build-arg VITE_LANG=${{ secrets.QA_VITE_LANG }} \
            --build-arg VITE_KEYCLOAK_URL=${{ secrets.QA_VITE_KEYCLOAK_URL }} \
            --build-arg VITE_KEYCLOAK_REALM=${{ secrets.QA_VITE_KEYCLOAK_REALM }} \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=${{ secrets.QA_VITE_KEYCLOAK_CLIENT_ID }} \
            --build-arg VITE_BACKEND_API_URL=${{ secrets.QA_VITE_BACKEND_API_URL }} \
            --build-arg VITE_BACKEND_API_VERSION=${{ secrets.QA_VITE_BACKEND_API_VERSION }} \
            --build-arg VITE_WS_URL=${{ secrets.QA_VITE_WS_URL }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:${{ steps.version.outputs.version }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:latest \
            .

      - name: Push Shell Image
        run: |
          docker push $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:${{ steps.version.outputs.version }}

      # =========================
      # DEPLOY QA SHELL
      # =========================
      - name: Deploy Shell
        id: deploy_shell
        run: |
          gcloud run deploy $SHELL_SERVICE \
            --image=$AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SHELL_SERVICE:${{ steps.version.outputs.version }} \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --port=80 \
            --set-env-vars="NODE_ENV=production" \
            --revision-suffix=${{ github.sha }} \
            --labels="commit=${{ github.sha }},branch=qa,app=qa-cgp-shell" \
            --quiet

          SHELL_URL=$(gcloud run services describe $SHELL_SERVICE \
            --region=$REGION \
            --format='value(status.url)')

          echo "shell_url=$SHELL_URL" >> $GITHUB_OUTPUT

      # =========================
      # QA SUMMARY
      # =========================
      - name: Deployment Summary
        run: |
          echo "===================================="
          echo "ATS Module URL: ${{ steps.deploy_ats.outputs.ats_url }}"
          echo "Shell URL: ${{ steps.deploy_shell.outputs.shell_url }}"
          echo "===================================="
